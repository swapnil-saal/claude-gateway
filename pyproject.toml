[project]
name = "claude-gateway"
version = "0.1.0"
description = "Local Anthropic Messages API and OpenAI Chat Completions API served by your Claude Code login"
readme = "README.md"
license = "MIT"
keywords = ["anthropic", "claude", "claude-code", "openai", "gateway", "proxy"]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "claude-agent-sdk>=0.2.161",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claude-gateway = "gateway.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
]
